services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document_qa_dev
    ports:
      - "5173:5173"
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      # Mount project source code for live hot-reloading
      - .:/app
      # Isolate node_modules inside container so it never pollutes the host PC
      - node_modules:/app/node_modules
      # Persist SQLite database across container restarts & image rebuilds
      - ./db:/app/db

volumes:
  node_modules:
